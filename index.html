<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kutty eCart - Kutty Shop, Periya Experience!</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-pink-50">
<!-- Navbar -->
<nav class="bg-white shadow p-4 flex justify-between sticky top-0 z-50">
  <h1 class="text-2xl font-bold text-pink-600">🛒 Kutty eCart</h1>
  <div class="flex gap-4">
    <button onclick="showPage('home')" class="font-semibold">Home</button>
    <button onclick="showPage('cart')" class="bg-pink-600 text-white px-4 py-1 rounded">Cart (<span id="cartCount">0</span>)</button>
    <button onclick="showPage('login')" id="loginBtn" class="border px-3 rounded">Login</button>
  </div>
</nav>

<!-- Home Page -->
<div id="homePage" class="p-6">
  <h2 class="text-3xl font-bold mb-2">Kutty Shop, Periya Experience! ✨</h2>
  <p class="text-gray-600 mb-6">MERN Stack Project - Single File Demo</p>
  <div id="productList" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
</div>

<!-- Cart Page -->
<div id="cartPage" class="p-6 hidden">
  <h2 class="text-2xl font-bold mb-4">Your Cart</h2>
  <div id="cartItems"></div>
  <div class="mt-6 bg-white p-4 rounded shadow">
    <p class="font-bold text-xl">Total: Rs. <span id="total">0</span></p>
    <button onclick="checkout()" class="mt-3 bg-green-600 text-white w-full py-2 rounded">Checkout & Pay</button>
  </div>
</div>

<!-- Checkout Success -->
<div id="successPage" class="p-10 text-center hidden">
  <h1 class="text-4xl">🎉 Order Confirmed!</h1>
  <p class="mt-4">Thank you for shopping with <b>Kutty eCart</b></p>
  <p class="mt-2 text-sm">Payment ID: <span id="payId"></span></p>
  <button onclick="showPage('home')" class="mt-6 bg-pink-600 text-white px-6 py-2 rounded">Continue Shopping</button>
</div>

<script>
let products = [
  {id:1, title:"Kutty Kurta Set", price:599, image:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=500", desc:"Cute ethnic wear"},
  {id:2, title:"Mini Handbag", price:399, image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500", desc:"Trendy small bag"},
  {id:3, title:"Kutty Sneakers", price:899, image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500", desc:"Comfy daily wear"},
  {id:4, title:"Hair Clip Set", price:199, image:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=500", desc:"6 pcs combo"},
  {id:5, title:"Cute Watch", price:1299, image:"https://images.unsplash.com/photo-1524805444973-bf35c6d5d2c9?w=500", desc:"Kutty edition"},
  {id:6, title:"Sunglasses", price:499, image:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500", desc:"Stylish"}
];
let cart = JSON.parse(localStorage.getItem('kuttyCart')||'[]');

function renderProducts(){
  document.getElementById('productList').innerHTML = products.map(p=>`
    <div class="bg-white rounded-xl shadow p-4">
      <img src="${p.image}" class="h-48 w-full object-cover rounded">
      <h3 class="font-bold mt-2">${p.title}</h3>
      <p class="text-sm text-gray-500">${p.desc}</p>
      <div class="flex justify-between items-center mt-3">
        <span class="font-bold text-pink-600">Rs. ${p.price}</span>
        <button onclick="addToCart(${p.id})" class="bg-pink-600 text-white px-3 py-1 rounded">Add to Cart</button>
      </div>
    </div>
  `).join('');
}

function addToCart(id){
  let item = products.find(p=>p.id===id);
  let existing = cart.find(c=>c.id===id);
  if(existing) existing.qty++;
  else cart.push({...item, qty:1});
  saveCart();
  alert(item.title + " added to Kutty eCart!");
}

function saveCart(){
  localStorage.setItem('kuttyCart', JSON.stringify(cart));
  document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);
  renderCart();
}

function renderCart(){
  if(cart.length===0){
    document.getElementById('cartItems').innerHTML = "<p>Cart empty da kutty!</p>";
    document.getElementById('total').innerText = 0;
    return;
  }
  document.getElementById('cartItems').innerHTML = cart.map(c=>`
    <div class="bg-white p-3 rounded shadow mb-2 flex justify-between">
      <div><b>${c.title}</b> x ${c.qty}</div>
      <div>Rs. ${c.price*c.qty} <button onclick="removeCart(${c.id})" class="text-red-500 ml-2">X</button></div>
    </div>
  `).join('');
  let total = cart.reduce((a,b)=>a+b.price*b.qty,0);
  document.getElementById('total').innerText = total;
}

function removeCart(id){ cart = cart.filter(c=>c.id!==id); saveCart(); }

function showPage(p){
  document.getElementById('homePage').classList.add('hidden');
  document.getElementById('cartPage').classList.add('hidden');
  document.getElementById('successPage').classList.add('hidden');
  if(p==='home') document.getElementById('homePage').classList.remove('hidden');
  if(p==='cart') document.getElementById('cartPage').classList.remove('hidden');
}

function checkout(){
  if(cart.length===0) return alert("Cart empty!");
  // Simulated Razorpay
  let payId = "pay_Kutty_"+Math.floor(Math.random()*1000000);
  document.getElementById('payId').innerText = payId;
  cart=[]; saveCart();
  document.getElementById('homePage').classList.add('hidden');
  document.getElementById('cartPage').classList.add('hidden');
  document.getElementById('successPage').classList.remove('hidden');
}

renderProducts(); saveCart();
</script>
</body>
</html>
